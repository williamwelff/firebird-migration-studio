<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Fluxo de segurança do Firebird Migration Studio</title><desc id="desc">A comparação de master e alvo produz um relatório de diferenças e um plano não executável. Qualquer escrita exige controles adicionais.</desc>
<rect width="1200" height="550" rx="24" fill="#f3f7fc"/><text x="55" y="77" font-size="36" font-weight="bold" font-family="Arial,sans-serif" fill="#112f59">Como funcionará a comparação</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="48" y="141" width="258" height="118" rx="16" fill="#fff" stroke="#c6d8ed" stroke-width="2"/><text x="177" y="186" font-size="25" font-weight="bold" fill="#1654a4">MASTER</text><text x="177" y="221" font-size="18" fill="#637387">Referência protegida</text>
<rect x="48" y="285" width="258" height="118" rx="16" fill="#fff" stroke="#c6d8ed" stroke-width="2"/><text x="177" y="330" font-size="25" font-weight="bold" fill="#1654a4">ALVO</text><text x="177" y="365" font-size="18" fill="#637387">Somente leitura na análise</text>
<path d="M306 200 H386 V272 H425 M306 343 H386 V272" fill="none" stroke="#2774db" stroke-width="5"/>
<rect x="425" y="210" width="300" height="124" rx="18" fill="#e1efff" stroke="#91b9e7" stroke-width="2"/><text x="575" y="258" font-size="25" font-weight="bold" fill="#153d73">Comparador</text><text x="575" y="293" font-size="18" fill="#415c7b">Estrutura + registros</text>
<path d="M725 272 H777" stroke="#2774db" stroke-width="5"/><path d="M765 262 L780 272 L765 282" fill="none" stroke="#2774db" stroke-width="5"/>
<rect x="782" y="210" width="356" height="124" rx="18" fill="#fff" stroke="#c6d8ed" stroke-width="2"/><text x="960" y="255" font-size="24" font-weight="bold" fill="#153d73">Relatório de diferenças</text><text x="960" y="293" font-size="17" fill="#637387">Prévia segura · sem executar SQL</text>
<rect x="75" y="445" width="1050" height="62" rx="16" fill="#deefe5"/><text x="600" y="482" font-size="19" fill="#1a6040">Segurança: nenhuma escrita no master · correções no alvo exigirão backup e aprovação</text>
<text x="600" y="535" font-size="15" fill="#637387">Esboço conceitual — funcionalidades de produção ainda não homologadas</text>
